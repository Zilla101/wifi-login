<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ network }} · Sign in</title>
<style>
  :root { --bg:#0b0d12; --card:#141821; --line:#232937; --text:#e8ecf3; --muted:#8a93a6;
          --accent:#4f8cff; --ok:#2ecc71; --err:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         display:flex; justify-content:center; padding:32px 16px; }
  .wrap { width:100%; max-width:420px; }
  .wrap.wide { max-width:900px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px var(--accent); }
  .brand b { font-size:18px; letter-spacing:.2px; }
  .brand .spacer { flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:16px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 12px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
          background:#0e1118; color:var(--text); font-size:16px; outline:none; }
  input:focus { border-color:var(--accent); }
  button, .btn { appearance:none; border:0; border-radius:10px; padding:12px 16px; font-size:15px;
                 font-weight:600; cursor:pointer; background:var(--accent); color:#fff; text-decoration:none; display:inline-block; }
  button.full { width:100%; margin-top:18px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.danger { background:transparent; border:1px solid #4a2328; color:var(--err); }
  button.small { padding:6px 10px; font-size:13px; font-weight:500; }
  .tabs { display:flex; background:#0e1118; border:1px solid var(--line); border-radius:10px; padding:4px; margin-bottom:6px; }
  .tabs a { flex:1; text-align:center; padding:9px; border-radius:8px; color:var(--muted); text-decoration:none; font-weight:600; }
  .tabs a.on { background:var(--card); color:var(--text); }
  .flash { padding:12px 14px; border-radius:10px; margin-bottom:14px; font-size:14px; }
  .flash.ok { background:#123322; color:var(--ok); } .flash.error { background:#3a1619; color:var(--err); }
  .row { display:flex; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .row .grow { flex:1; min-width:0; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { font-size:11px; padding:3px 8px; border-radius:99px; background:#1d2433; color:var(--muted); }
  .pill.ok { background:#123322; color:var(--ok); } .pill.err { background:#3a1619; color:var(--err); }
  .pill.admin { background:#1b2a4d; color:var(--accent); }
  .meter { height:6px; background:#0e1118; border-radius:99px; overflow:hidden; margin-top:8px; }
  .meter i { display:block; height:100%; background:var(--accent); }
  .inline { display:inline; } .inline input { width:70px; padding:6px 8px; font-size:13px; }
  .inline input.pw { width:110px; }
  code { color:var(--muted); font-size:12px; }
  .actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; }
  .stats div { flex:1; min-width:120px; } .stats b { font-size:24px; display:block; }
</style>
</head>
<body>
<div class="wrap {% block wrapclass %}{% endblock %}">
  <div class="brand">
    <span class="dot"></span><b>{{ network }}</b><span class="spacer"></span>
    {% if me %}
      {% if me.is_admin %}<a class="pill admin" href="{{ url_for('admin') }}" style="text-decoration:none">Admin</a>{% endif %}
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost small">Sign out</button>
      </form>
    {% endif %}
  </div>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</div>
</body>
</html>
